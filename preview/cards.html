<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #F0F5FB; font-family: 'DM Sans', sans-serif; }
  .row { display: flex; gap: 16px; }
  .card { background: white; border-radius: 14px; overflow: hidden; width: 172px; box-shadow: 0 1px 4px rgba(29,34,53,0.07), 0 4px 12px rgba(29,34,53,0.05); transition: transform 250ms ease-out, box-shadow 250ms ease-out; cursor: pointer; }
  .card:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 8px 24px rgba(29,34,53,0.12); }
  .card-img { width: 100%; height: 116px; background: #E4EDF8; display: flex; align-items: center; justify-content: center; position: relative; }
  .badge { position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; }
  .b-new  { background: #1D2235; color: white; }
  .b-sale { background: #D4849A; color: white; }
  .b-hot  { background: #BBCFEB; color: #1D2235; }
  .card-body { padding: 12px 14px 14px; }
  .card-name { font-family: 'Playfair Display', serif; font-size: 13px; font-weight: 600; color: #1D2235; line-height: 1.35; margin-bottom: 6px; }
  .card-price { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; color: #1D2235; }
  .card-price-old { font-size: 11px; color: #A8AFCA; text-decoration: line-through; font-family: 'DM Mono', monospace; margin-right: 5px; }
  .heart { position: absolute; top: 8px; right: 10px; font-size: 16px; color: #D4849A; }
</style>
</head>
<body>
<div class="row">
  <div class="card">
    <div class="card-img">
      <div class="badge b-new">Novo</div>
      <span class="heart">♥</span>
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#8AAFD8" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    </div>
    <div class="card-body">
      <div class="card-name">Porta-Retratos Geométrico</div>
      <div><span class="card-price-old">R$ 119,90</span><span class="card-price">R$ 89,90</span></div>
    </div>
  </div>
  <div class="card">
    <div class="card-img">
      <div class="badge b-hot">+ Vendido</div>
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#8AAFD8" stroke-width="1.5" stroke-linecap="round"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
    </div>
    <div class="card-body">
      <div class="card-name">Vaso Orgânico Moderno</div>
      <div><span class="card-price">R$ 64,90</span></div>
    </div>
  </div>
  <div class="card">
    <div class="card-img">
      <div class="badge b-sale">-20%</div>
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#8AAFD8" stroke-width="1.5" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </div>
    <div class="card-body">
      <div class="card-name">Suporte Articulado para Celular</div>
      <div><span class="card-price-old">R$ 49,90</span><span class="card-price">R$ 39,90</span></div>
    </div>
  </div>
</div>
</body>
</html>
