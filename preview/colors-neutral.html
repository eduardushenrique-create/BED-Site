<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: white; font-family: var(--font-body); }
  .row { display: flex; gap: 6px; }
  .swatch { flex: 1; border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,0.06); }
  .swatch-color { height: 60px; }
  .swatch-label { padding: 7px 9px; background: white; }
  .swatch-name { font-size: 10px; font-weight: 600; color: #1D2235; }
  .swatch-hex { font-size: 10px; color: #6B7494; font-family: monospace; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch"><div class="swatch-color" style="background:#1D2235;"></div><div class="swatch-label"><div class="swatch-name">900</div><div class="swatch-hex">#1D2235</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#3D4460;"></div><div class="swatch-label"><div class="swatch-name">700</div><div class="swatch-hex">#3D4460</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#6B7494;"></div><div class="swatch-label"><div class="swatch-name">500</div><div class="swatch-hex">#6B7494</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#A8AFCA;"></div><div class="swatch-label"><div class="swatch-name">300</div><div class="swatch-hex">#A8AFCA</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#D8DCE8;"></div><div class="swatch-label"><div class="swatch-name">200</div><div class="swatch-hex">#D8DCE8</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#EEF1F8;"></div><div class="swatch-label"><div class="swatch-name">100</div><div class="swatch-hex">#EEF1F8</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#F0F5FB; border:1px solid #D8DCE8;"></div><div class="swatch-label"><div class="swatch-name">BG</div><div class="swatch-hex">#F0F5FB</div></div></div>
</div>
</body>
</html>
