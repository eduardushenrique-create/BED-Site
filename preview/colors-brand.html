<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--color-bg); font-family: var(--font-body); }
  .row { display: flex; gap: 8px; }
  .swatch { flex: 1; border-radius: 10px; overflow: hidden; }
  .swatch-color { height: 72px; }
  .swatch-label { padding: 8px 10px; background: white; }
  .swatch-name { font-size: 11px; font-weight: 600; color: #1D2235; }
  .swatch-hex { font-size: 10px; color: #6B7494; font-family: monospace; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch">
    <div class="swatch-color" style="background:#BBCFEB;"></div>
    <div class="swatch-label"><div class="swatch-name">Brand Blue</div><div class="swatch-hex">#BBCFEB</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#8AAFD8;"></div>
    <div class="swatch-label"><div class="swatch-name">Blue Dark</div><div class="swatch-hex">#8AAFD8</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#E4EDF8;"></div>
    <div class="swatch-label"><div class="swatch-name">Blue Light</div><div class="swatch-hex">#E4EDF8</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#1D2235;"></div>
    <div class="swatch-label"><div class="swatch-name">Navy</div><div class="swatch-hex">#1D2235</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#2E3650;"></div>
    <div class="swatch-label"><div class="swatch-name">Navy Mid</div><div class="swatch-hex">#2E3650</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#D4849A;"></div>
    <div class="swatch-label"><div class="swatch-name">Rose (heart)</div><div class="swatch-hex">#D4849A</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#F7E6EB;"></div>
    <div class="swatch-label"><div class="swatch-name">Rose Light</div><div class="swatch-hex">#F7E6EB</div></div>
  </div>
</div>
</body>
</html>
