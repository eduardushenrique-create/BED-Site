<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: white; font-family: var(--font-body); }
  .row { display: flex; gap: 10px; }
  .chip { flex: 1; border-radius: 10px; padding: 14px 16px; }
  .chip-label { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .chip-sub { font-size: 10px; opacity: 0.75; font-family: monospace; }
</style>
</head>
<body>
<div class="row">
  <div class="chip" style="background:#E0F4F0;"><div class="chip-label" style="color:#2E7D6E;">✓ Sucesso</div><div class="chip-sub" style="color:#2E7D6E;">#2E7D6E</div></div>
  <div class="chip" style="background:#FEF0DC;"><div class="chip-label" style="color:#A05C1A;">⚠ Atenção</div><div class="chip-sub" style="color:#A05C1A;">#A05C1A</div></div>
  <div class="chip" style="background:#FDE8E6;"><div class="chip-label" style="color:#C0392B;">✕ Erro</div><div class="chip-sub" style="color:#C0392B;">#C0392B</div></div>
  <div class="chip" style="background:#DBEAFE;"><div class="chip-label" style="color:#2563EB;">ℹ Info</div><div class="chip-sub" style="color:#2563EB;">#2563EB</div></div>
</div>
</body>
</html>
