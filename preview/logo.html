<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: white; padding: 24px; }
  .row { display: flex; gap: 16px; align-items: stretch; }
  .logo-card { flex: 1; border-radius: 14px; padding: 28px 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .light { background: #FFFFFF; }
  .blue  { background: #BBCFEB; }
  .dark  { background: #1D2235; }
  .logo-img { width: 120px; height: 120px; object-fit: contain; }
  .logo-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
  .light .logo-label { color: #6B7494; }
  .blue .logo-label  { color: #2E3650; }
  .dark .logo-label  { color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
<div class="row">
  <div class="logo-card light">
    <img class="logo-img" src="../assets/logo.png" alt="B&D logo" style="mix-blend-mode:multiply; border-radius:12px;">
    <span class="logo-label">Fundo claro</span>
  </div>
  <div class="logo-card blue">
    <img class="logo-img" src="../assets/logo.png" alt="B&D logo" style="border-radius:12px;">
    <span class="logo-label">Fundo azul (brand)</span>
  </div>
  <div class="logo-card dark">
    <img class="logo-img" src="../assets/logo.png" alt="B&D logo" style="mix-blend-mode:luminosity; border-radius:12px;">
    <span class="logo-label">Fundo escuro</span>
  </div>
</div>
</body>
</html>
