name: Database Migrations

# Aplica `prisma migrate deploy` contra o Postgres de producao via runner
# GitHub (que tem o node_modules completo via npm ci, ao contrario do
# runner image do Railway que esta sem effect/c12/deepmerge-ts/empathic).
#
# Decisao em ADR-002 (rev v2 do PR-5). Substitui a tentativa de migrate
# no startup do container, que ficou silenciosamente quebrada desde o
# upgrade pra Prisma 7 e causou os incidentes de 2026-05-13.
#
# Pre-requisito de operacao: secret DATABASE_URL_PRODUCTION configurado
# em github.com/eduardushenrique-create/BED-Site/settings/secrets/actions
# (cadastrado pelo stakeholder antes deste PR).

on:
  push:
    branches: [main]
    # Pular se o push so afeta documentacao/configuracao sem schema.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '.github/labeler.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do disparo manual (auditoria)'
        required: false
        default: 'Manual run'

# Garante que duas runs nao apliquem migrations em paralelo.
# NUNCA cancelar no meio (cancel-in-progress: false).
concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Show pending migrations (informational)
        run: npx prisma migrate status || true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}

      - name: Confirm sync
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
