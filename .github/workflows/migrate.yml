name: Database Migrations

# Aplica `prisma migrate deploy` contra o Postgres de producao via runner
# GitHub. Substitui a tentativa de migrate no startup do Railway, que
# ficou silenciosamente quebrada desde o upgrade pra Prisma 7 e causou
# os incidentes de 2026-05-13. Decisao em ADR-002.
#
# Pre-requisito: secret DATABASE_URL_PRODUCTION com a URL PUBLICA do
# Railway (formato `<host>.proxy.rlwy.net:<port>`). A URL interna
# (`postgres.railway.internal`) NAO funciona aqui — vide PR #150 que
# falhou e quebrou prod por 6min em 2026-05-14.
# Memoria: feedback_railway_db_url_publica.md
#
# Este eh o PR-5a do plano da ADR-003 v2: SO o workflow, sem o resto.
# Ao mergear, o workflow dispara automaticamente em push pra main e
# valida que conecta no banco (alem de aplicar migrations idempotentes
# — sem migrations novas no disco, sera no-op). Se ficar verde, abre
# PR-5b com start.mjs + Dockerfile + canary + boot-smoke.

on:
  push:
    branches: [main]
    # Pular se push so afeta documentacao/configuracao sem schema
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '.github/labeler.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do disparo manual (auditoria)'
        required: false
        default: 'Manual run'

concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Show current migration status
        run: npx prisma migrate status || true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}

      - name: Apply pending migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}

      - name: Confirm sync
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
