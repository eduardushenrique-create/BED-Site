name: Promote staging -> prd

# Promove um commit que ja foi validado em staging para producao.
#
# Como funciona:
# 1. Resolve o commit alvo (input `commit_sha` ou HEAD de main).
# 2. Verifica que o smoke staging (workflow `Smoke — Staging`) ficou
#    verde naquele commit. Se nao, falha com mensagem leiga — esse eh
#    o GATE de release.
# 3. Calcula a proxima tag `vYYYY.MM.DD-N` (N sequencial por dia).
# 4. Cria a tag, faz push. O push da tag dispara `migrate-prd.yml`
#    (aplicar migrations em prd) e o Railway prd faz deploy automatico
#    da tag (apos stakeholder ter ajustado os triggers no painel —
#    vide ADR-004 e comentario no PR-staging-C+D).
#
# PR-staging-D da Onda 1 (HANDOFF-SPEC-007.md §4).

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'SHA do commit a promover (vazio = HEAD de main)'
        required: false
        default: ''
      reason:
        description: 'Motivo da promocao (auditoria — ex: "release SPEC-005 final")'
        required: true

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Validate smoke & tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write     # push tag
      actions: read       # listar check-runs/workflow-runs
      checks: read        # ler check_runs API

    steps:
      - name: Checkout main (full history for tag computation)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Token padrao do GITHUB_TOKEN ja eh suficiente porque
          # `permissions.contents: write` autoriza push de tag.

      - name: Resolve target commit
        id: resolve
        env:
          INPUT_SHA: ${{ github.event.inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SHA" ]; then
            SHA="$INPUT_SHA"
          else
            SHA="$(git rev-parse origin/main)"
          fi
          # Normaliza pra full SHA (40 chars). Falha se commit nao existe.
          FULL_SHA="$(git rev-parse "$SHA^{commit}")"
          SHORT_SHA="${FULL_SHA:0:7}"
          SUBJECT="$(git log -1 --format=%s "$FULL_SHA")"
          echo "sha=$FULL_SHA"        >> "$GITHUB_OUTPUT"
          echo "short=$SHORT_SHA"     >> "$GITHUB_OUTPUT"
          echo "subject=$SUBJECT"     >> "$GITHUB_OUTPUT"
          echo ""
          echo "::notice::Promovendo commit $SHORT_SHA ('$SUBJECT')"

      - name: Verify staging smoke is green for this commit
        id: smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.resolve.outputs.sha }}
          SHORT: ${{ steps.resolve.outputs.short }}
        run: |
          set -euo pipefail
          # Em vez de checar `check-runs` por SHA, checamos workflow_runs
          # do migrate-staging.yml com head_sha = $SHA. Por que:
          #
          # check_runs sao gravados pelo GITHUB_SHA do contexto que produz
          # o run. Em workflows disparados via workflow_run, isso eh o HEAD
          # do branch no momento — nao o SHA do upstream. Resultado: em
          # rajadas de push, o check_run "Playwright smoke" ficava anexado
          # num SHA diferente do que foi testado, e o gate aceitava
          # promocoes de commits "validados" sob o SHA de outro commit
          # (descoberta documentada em ADR-004, atualizacao pos-teste 3).
          #
          # A solucao mais segura ja foi mover smoke pra dentro de
          # migrate-staging.yml como job dependente (PR #168 / fix do gate).
          # Mas o check_run-fantasma de ciclos anteriores nao pode ser
          # apagado e contamina commits passados.
          #
          # workflow_runs ficam atrelados ao head_sha do PUSH real (nao do
          # contexto). Tambem nao tem fantasma — workflow_run so existe
          # se o workflow foi efetivamente disparado. O conclusion success
          # exige que TODOS os jobs (migrate + smoke) ficaram verdes —
          # falha de smoke arrasta o run inteiro pra failure.

          RESPONSE="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/migrate-staging.yml/runs?head_sha=$SHA&per_page=20")"

          TOTAL="$(echo "$RESPONSE" | jq '.total_count')"
          SUCCESSES="$(echo "$RESPONSE" | jq '[.workflow_runs[] | select(.conclusion=="success")] | length')"

          echo "Total migrate-staging runs no commit $SHORT: $TOTAL"
          echo "Sucesso (migrate + smoke verde no mesmo SHA): $SUCCESSES"

          if [ "$SUCCESSES" -lt 1 ]; then
            echo ""
            echo "::error::Staging nao foi validado para o commit $SHORT."
            echo "::error::Verifique em Actions -> Database Migrations — Staging se rodou e ficou verde nesse SHA."
            echo "::error::Se o commit so tocou em docs (paths-ignore), nao houve smoke automatico."
            echo "::error::Disparar smoke manual: Actions -> Smoke — Staging (manual) -> Run workflow com ref=$SHORT"
            exit 1
          fi

          echo "::notice::migrate-staging + smoke verde no commit $SHORT — gate liberado."

      - name: Compute next tag (vYYYY.MM.DD-N)
        id: tag
        run: |
          set -euo pipefail
          # Tags do dia, ex: v2026.05.14-1, v2026.05.14-2
          DATE="v$(date -u +%Y.%m.%d)"
          git fetch --tags origin
          # Lista tags do dia, extrai sufixo N (numero apos hifen), pega max.
          MAX="$(git tag --list "${DATE}-*" \
            | sed -E "s/^${DATE}-([0-9]+)$/\1/" \
            | grep -E '^[0-9]+$' \
            | sort -n \
            | tail -1 || true)"
          if [ -z "$MAX" ]; then
            NEXT=1
          else
            NEXT=$((MAX + 1))
          fi
          TAG="${DATE}-${NEXT}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Proxima tag calculada: $TAG"

      - name: Create and push tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
          SHORT: ${{ steps.resolve.outputs.short }}
          REASON: ${{ github.event.inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tag anotada (carrega autor + motivo no audit trail).
          # A tag dispara `migrate-prd.yml` (Prisma migrate deploy em prd-db).
          git tag -a "$TAG" "$SHA" -m "Promote staging -> prd

          Commit: $SHORT
          Actor:  $ACTOR
          Reason: $REASON"
          git push origin "$TAG"
          echo "::notice::Tag $TAG criada e enviada."

      - name: Fast-forward branch `production` (Railway prd deploy trigger)
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          SHORT: ${{ steps.resolve.outputs.short }}
        run: |
          set -euo pipefail
          # Por que esse step existe (resumido — completo em ADR-004):
          # Railway nao suporta deploy em push de tag, so de branch. Para
          # fechar o gate do lado de Railway prd, mantemos uma branch
          # dedicada `production` cujo HEAD eh sempre o SHA validado pelo
          # smoke + promovido aqui. Railway prd escuta `production` (vide
          # configuracao manual no painel — runbook §3-bis).
          #
          # Usar `--force-with-lease` evita overwrite acidental se um
          # promote concorrente atualizar production entre nosso fetch e
          # push (cancel-in-progress: false no concurrency group ja
          # serializa os promotes, mas --force-with-lease eh defense in
          # depth contra alguem pushando manual na branch).
          git fetch origin production || true
          if git rev-parse --verify --quiet origin/production >/dev/null; then
            PROD_SHA="$(git rev-parse origin/production)"
            echo "production HEAD atual: ${PROD_SHA:0:7}"
            # Sanity: nao avancar se for mesmo SHA (no-op explicito).
            if [ "$PROD_SHA" = "$SHA" ]; then
              echo "::notice::production ja aponta para $SHORT — nada a fazer."
              exit 0
            fi
            git push origin "$SHA:refs/heads/production" \
              --force-with-lease="refs/heads/production:$PROD_SHA"
          else
            # Primeira vez (branch nao existe no remoto) — push simples.
            git push origin "$SHA:refs/heads/production"
          fi
          echo "::notice::production atualizada para $SHORT — Railway prd vai deployar."

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHORT: ${{ steps.resolve.outputs.short }}
          SUBJECT: ${{ steps.resolve.outputs.subject }}
          ACTOR: ${{ github.actor }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          {
            echo "## Promote -> prd"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Commit | \`$SHORT\` |"
            echo "| Subject | $SUBJECT |"
            echo "| Tag | \`$TAG\` |"
            echo "| Actor | @$ACTOR |"
            echo "| Reason | $REASON |"
            echo ""
            echo "**Proximos passos automaticos:**"
            echo "- \`Database Migrations — Production\` aplica migrations em prd-db (via tag)"
            echo "- Railway prd detecta push em branch \`production\` e faz deploy do commit \`$SHORT\`"
            echo ""
            echo "**Como verificar:**"
            echo "- \`git fetch && git log production --oneline -5\` mostra o HEAD atual de production"
            echo "- Railway painel -> Deployments mostra o deploy em andamento"
            echo ""
            echo "[Ver Actions](https://github.com/${GITHUB_REPOSITORY}/actions)"
          } >> "$GITHUB_STEP_SUMMARY"
