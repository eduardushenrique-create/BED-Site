name: Database Migrations — Production

# Aplica `prisma migrate deploy` contra o Postgres de PRODUCAO.
#
# IMPORTANTE: este workflow SO dispara em push de tag `v*`. Tags sao
# criadas pelo `promote.yml` (Actions → Promote staging → prd), que
# valida o smoke verde em staging antes de promover. NUNCA criar tag
# `v*` manualmente sem rodar promote — isso pula o gate de smoke e
# pode levar uma regressao direto pra prd.
#
# Pre-requisito: secret DATABASE_URL_PRODUCTION com a URL PUBLICA do
# Railway (formato `<host>.proxy.rlwy.net:<port>`). A URL interna
# (`postgres.railway.internal`) NAO funciona aqui — vide PR #150 que
# falhou e quebrou prod por 6min em 2026-05-14.
# Memoria: feedback_railway_db_url_publica.md
#
# Historico: este workflow foi renomeado de `migrate.yml` para
# `migrate-prd.yml` no PR-staging-C (Onda 1 da SPEC-007), quando o
# trigger mudou de `push: branches: [main]` para `push: tags: ['v*']`.
# A versao em staging eh aplicada por `migrate-staging.yml`, em todo
# push em main (gate antes da promocao).
# Decisao registrada em ADR-002 (motivacao original) + ADR-004
# (separacao staging/prd).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do disparo manual (auditoria)'
        required: false
        default: 'Manual run'

concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Prisma migrations (production)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Show current migration status
        run: npx prisma migrate status || true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}

      - name: Apply pending migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}

      - name: Confirm sync
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
