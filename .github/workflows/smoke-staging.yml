name: Smoke — Staging (manual)

# Smoke Playwright manual contra Railway staging.
#
# Por que existe um workflow separado para isso:
# O smoke automatico (que dispara apos cada migrate-staging) vive DENTRO
# de migrate-staging.yml como job dependente — vide comentario daquele
# arquivo sobre correcao do gate. Este arquivo continua existindo apenas
# para casos manuais:
#   - testar staging com um SHA/branch/tag arbitrario sem precisar de push
#   - re-rodar smoke depois que Railway estava em cold start
#   - validar staging apos popular dados a mao
#
# O check_run produzido aqui NAO eh confiavel para o promote.yml — ele
# fica anexado ao SHA do ref escolhido, que pode nao coincidir com main.
# Para gate de release real, o caminho eh migrate-staging.yml (que roda
# smoke automaticamente em todo push em main).
#
# Pre-requisitos de secrets: STAGING_BASE_URL.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag ou SHA para testar (default: main)'
        required: false
        default: 'main'
      reason:
        description: 'Motivo do disparo (auditoria)'
        required: false
        default: 'Manual smoke'

concurrency:
  group: smoke-staging-manual
  cancel-in-progress: false

jobs:
  smoke:
    name: Playwright smoke (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browser (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Show staging target
        run: |
          echo "Smoking $STAGING_BASE_URL"
          echo "Ref: $REF (resolvido para SHA $GITHUB_SHA)"
          echo "Reason: $REASON"
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          REF: ${{ github.event.inputs.ref }}
          REASON: ${{ github.event.inputs.reason }}

      - name: Run smoke tests
        run: npx playwright test --config=playwright.staging.config.ts
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-report
          path: |
            playwright-report-staging/
            test-results/
          retention-days: 14
