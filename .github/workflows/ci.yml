name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest

    env:
      # Build-time defaults so prisma generate and next build don't crash
      # without real production secrets. Runtime envs come from Railway.
      DATABASE_URL: postgresql://johndoe:randompassword@localhost:5432/mydb?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_STORE_ORIGIN_ZIP: '01001000'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint
        continue-on-error: true # warning-only enforcement; non-blocking until rules stabilize

      - name: Typecheck
        # tsconfig.ci.json excludes tests/e2e.spec.ts which has 2 pre-existing
        # Playwright type errors the team has chosen not to fix in this gate.
        run: npx tsc --noEmit --project tsconfig.ci.json

      - name: Build
        run: npx next build

      - name: Migration BOM check
        # Postgres rejects migrations with a UTF-8 BOM. Catch it early.
        run: |
          set -e
          shopt -s nullglob
          for f in prisma/migrations/*/migration.sql; do
            head_bytes=$(head -c 3 "$f" | xxd -p)
            if [ "$head_bytes" = "efbbbf" ]; then
              echo "::error file=$f::Migration starts with UTF-8 BOM (efbbbf)"
              exit 1
            fi
          done

      - name: Forbidden patterns check (CR-8)
        # Bloqueia padroes anti que ja causaram incidente (PrismaClient sem
        # options, COPY node_modules inteiro, endpoints temp sem expiracao).
        # Vide ci/forbidden-patterns.sh + POSTMORTEM-2026-05-13-deploys.md.
        run: bash ci/forbidden-patterns.sh

      - name: Required Order columns check (R13)
        # Garante que REQUIRED_ORDER_COLUMNS no health route cobre todas
        # as colunas escalares de model Order. Sem isso, vazamento de
        # coluna nova passa despercebido pelo health (incidente PR #141).
        run: bash ci/check-required-order-columns.sh

  prisma-smoke:
    name: Prisma client smoke (G4 partial)
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke?schema=public
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prisma client smoke (instancia + connect + query)
        # Valida que o Prisma client compilado pelo build atual:
        # 1. Instancia sem lancar (cobre o bug do PR #143 — `new
        #    PrismaClient()` sem options)
        # 2. Conecta ao Postgres real
        # 3. Roda migrations idempotentes
        # 4. Faz query simples em Order
        # Detalhes: ci/prisma-smoke.sh
        run: bash ci/prisma-smoke.sh

  boot-smoke:
    name: Boot smoke (G4 completo - start.mjs + Next + health)
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_STORE_ORIGIN_ZIP: '01001000'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next standalone
        run: npx next build

      - name: Boot smoke (start.mjs real contra Postgres real)
        # Valida o caminho ponta a ponta: aplica migrations, sobe Next
        # standalone via scripts/start.mjs, espera /api/health responder
        # 200. Pega o tipo de bug que quebrou o boot no PR #143.
        # Detalhes: ci/boot-smoke-test.sh
        run: bash ci/boot-smoke-test.sh
