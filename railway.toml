# Configuração explícita do deploy. Sobrescreve qualquer "Start Command" que
# eventualmente esteja salvo no painel do Railway — evita o caso em que o
# painel manda "npm start" e o CMD do Dockerfile é ignorado.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Wrapper de startup: roda `prisma migrate deploy` automaticamente antes
# de subir o Next. Schema, migrations e Prisma CLI agora ficam no container
# final (Dockerfile copia explicitamente). Isso elimina a janela em que o
# Prisma client esperava colunas que ainda nao existiam no banco — o
# script idempotente garante que cada deploy tenha o schema correto.
startCommand = "node scripts/start.mjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
