# Configuração explícita do deploy. Sobrescreve qualquer "Start Command" que
# eventualmente esteja salvo no painel do Railway — evita o caso em que o
# painel manda "npm start" e o CMD do Dockerfile é ignorado.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Apenas sobe o Next standalone. Migrations rodam manualmente via
# `railway run npx prisma migrate deploy` — tentar rodar o CLI do Prisma
# no container final do Next standalone falha porque o image não tem os
# arquivos auxiliares (wasm) do CLI.
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
