<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — B&D Artes & Impressões</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #F0F5FB; color: #1D2235; -webkit-font-smoothing: antialiased; }
  input, select { font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 11px 14px; border: 1.5px solid #D8DCE8; border-radius: 10px; outline: none; background: white; color: #1D2235; width: 100%; transition: border-color 150ms; }
  input:focus, select:focus { border-color: #8AAFD8; box-shadow: 0 0 0 3px rgba(187,207,235,0.25); }
  label { display: block; font-size: 13px; font-weight: 500; color: #3D4460; margin-bottom: 5px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const STEPS = ['Carrinho','Entrega','Pagamento','Confirmação'];
const CART_ITEMS = [
  { name:'Porta-Retratos Geométrico', detail:'Tamanho M · Azul · "Ana & João 2024"', price:89.90, qty:1 },
  { name:'Mini Vaso com Mensagem', detail:'Tamanho P · Branco · Sem personalização', price:44.90, qty:2 },
];

const StepBar = ({ step }) => (
  <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:0, marginBottom:40 }}>
    {STEPS.map((s, i) => (
      <React.Fragment key={s}>
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:6 }}>
          <div style={{ width:32, height:32, borderRadius:'50%', background: i <= step ? '#1D2235' : '#D8DCE8', color: i <= step ? 'white' : '#A8AFCA', display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:700, transition:'all 250ms' }}>
            {i < step ? '✓' : i+1}
          </div>
          <div style={{ fontSize:12, fontWeight: i===step ? 600 : 400, color: i <= step ? '#1D2235' : '#A8AFCA', whiteSpace:'nowrap' }}>{s}</div>
        </div>
        {i < STEPS.length-1 && <div style={{ height:2, width:80, background: i < step ? '#1D2235' : '#D8DCE8', margin:'0 8px', marginBottom:20, transition:'background 250ms' }} />}
      </React.Fragment>
    ))}
  </div>
);

const OrderSummary = ({ compact }) => {
  const subtotal = CART_ITEMS.reduce((s, i) => s + i.price * i.qty, 0);
  return (
    <div style={{ background:'white', borderRadius:16, padding:24, boxShadow:'0 1px 4px rgba(29,34,53,0.07)', position:'sticky', top:24 }}>
      <div style={{ fontFamily:"'Playfair Display',serif", fontSize:18, fontWeight:700, color:'#1D2235', marginBottom:20 }}>Resumo do pedido</div>
      {CART_ITEMS.map((item, i) => (
        <div key={i} style={{ display:'flex', gap:12, marginBottom:16 }}>
          <div style={{ width:52, height:52, background:'#E4EDF8', borderRadius:10, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8AAFD8" strokeWidth="1.5" strokeLinecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          </div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:13, fontWeight:600, color:'#1D2235', marginBottom:2 }}>{item.name}</div>
            <div style={{ fontSize:11, color:'#6B7494', marginBottom:4 }}>{item.detail}</div>
            <div style={{ display:'flex', justifyContent:'space-between' }}>
              <span style={{ fontSize:12, color:'#A8AFCA' }}>Qtd: {item.qty}</span>
              <span style={{ fontFamily:"'DM Mono',monospace", fontSize:13, fontWeight:500, color:'#1D2235' }}>R$ {(item.price * item.qty).toFixed(2).replace('.',',')}</span>
            </div>
          </div>
        </div>
      ))}
      <div style={{ borderTop:'1px solid #EEF1F8', paddingTop:16, marginTop:8 }}>
        {[['Subtotal', `R$ ${subtotal.toFixed(2).replace('.',',')}`], ['Frete', 'Grátis'], ['Desconto', '— R$ 0,00']].map(([k,v]) => (
          <div key={k} style={{ display:'flex', justifyContent:'space-between', marginBottom:8 }}>
            <span style={{ fontSize:13, color:'#6B7494' }}>{k}</span>
            <span style={{ fontSize:13, color: k==='Frete' ? '#2E7D6E' : '#1D2235', fontFamily:"'DM Mono',monospace", fontWeight:500 }}>{v}</span>
          </div>
        ))}
        <div style={{ display:'flex', justifyContent:'space-between', paddingTop:12, borderTop:'1px solid #EEF1F8', marginTop:4 }}>
          <span style={{ fontSize:15, fontWeight:600, color:'#1D2235' }}>Total</span>
          <span style={{ fontFamily:"'DM Mono',monospace", fontSize:18, fontWeight:500, color:'#1D2235' }}>R$ {subtotal.toFixed(2).replace('.',',')}</span>
        </div>
        <div style={{ fontSize:12, color:'#6B7494', textAlign:'right', marginTop:4 }}>em até 12x sem juros</div>
      </div>
      {/* Coupon */}
      <div style={{ marginTop:16, display:'flex', gap:8 }}>
        <input placeholder="Código de desconto" style={{ flex:1, fontSize:13, padding:'9px 12px' }} />
        <button style={{ background:'#1D2235', color:'white', border:'none', borderRadius:8, padding:'9px 14px', fontSize:13, fontWeight:600, cursor:'pointer', fontFamily:"'DM Sans',sans-serif", whiteSpace:'nowrap' }}>Aplicar</button>
      </div>
    </div>
  );
};

const StepCart = ({ onNext }) => (
  <div>
    <h2 style={{ fontFamily:"'Playfair Display',serif", fontSize:28, fontWeight:700, color:'#1D2235', marginBottom:24 }}>Seu carrinho</h2>
    {CART_ITEMS.map((item, i) => (
      <div key={i} style={{ background:'white', borderRadius:14, padding:20, marginBottom:12, display:'flex', gap:16, boxShadow:'0 1px 4px rgba(29,34,53,0.06)' }}>
        <div style={{ width:72, height:72, background:'#E4EDF8', borderRadius:12, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8AAFD8" strokeWidth="1.5" strokeLinecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        </div>
        <div style={{ flex:1 }}>
          <div style={{ fontFamily:"'Playfair Display',serif", fontSize:15, fontWeight:600, color:'#1D2235', marginBottom:4 }}>{item.name}</div>
          <div style={{ fontSize:12, color:'#6B7494', marginBottom:10 }}>{item.detail}</div>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <div style={{ display:'flex', alignItems:'center', border:'1px solid #D8DCE8', borderRadius:8, overflow:'hidden' }}>
              <button style={{ width:32, height:32, background:'white', border:'none', cursor:'pointer', fontSize:16, color:'#1D2235', fontFamily:"'DM Sans',sans-serif" }}>−</button>
              <span style={{ width:32, textAlign:'center', fontSize:13, fontWeight:600, fontFamily:"'DM Mono',monospace" }}>{item.qty}</span>
              <button style={{ width:32, height:32, background:'white', border:'none', cursor:'pointer', fontSize:16, color:'#1D2235', fontFamily:"'DM Sans',sans-serif" }}>+</button>
            </div>
            <span style={{ fontFamily:"'DM Mono',monospace", fontSize:16, fontWeight:500, color:'#1D2235' }}>R$ {(item.price*item.qty).toFixed(2).replace('.',',')}</span>
          </div>
        </div>
      </div>
    ))}
    <button onClick={onNext} style={{ width:'100%', background:'#1D2235', color:'white', fontFamily:"'DM Sans',sans-serif", fontSize:16, fontWeight:600, padding:'16px 0', border:'none', borderRadius:12, cursor:'pointer', marginTop:8 }}>Continuar para entrega</button>
  </div>
);

const Field = ({ label, placeholder, half, type='text' }) => (
  <div style={{ gridColumn: half ? 'span 1' : 'span 2' }}>
    <label>{label}</label>
    <input type={type} placeholder={placeholder} />
  </div>
);

const StepShipping = ({ onNext, onBack }) => (
  <div>
    <h2 style={{ fontFamily:"'Playfair Display',serif", fontSize:28, fontWeight:700, color:'#1D2235', marginBottom:24 }}>Endereço de entrega</h2>
    <div style={{ background:'white', borderRadius:16, padding:28, boxShadow:'0 1px 4px rgba(29,34,53,0.06)', marginBottom:20 }}>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
        <Field label="Nome completo" placeholder="Ana Paula Silva" />
        <Field label="CPF" placeholder="000.000.000-00" half />
        <Field label="E-mail" placeholder="ana@exemplo.com" type="email" half />
        <Field label="Telefone" placeholder="(11) 99999-9999" half />
        <Field label="CEP" placeholder="00000-000" half />
        <Field label="Rua" placeholder="Rua das Flores" />
        <Field label="Número" placeholder="123" half />
        <Field label="Complemento" placeholder="Apto 4B (opcional)" half />
        <Field label="Bairro" placeholder="Jardins" half />
        <Field label="Cidade" placeholder="São Paulo" half />
        <div>
          <label>Estado</label>
          <select style={{ width:'100%', fontFamily:"'DM Sans',sans-serif", fontSize:14, padding:'11px 14px', border:'1.5px solid #D8DCE8', borderRadius:10, outline:'none', background:'white', color:'#1D2235' }}>
            {['SP','RJ','MG','RS','SC','PR','BA','GO'].map(uf => <option key={uf}>{uf}</option>)}
          </select>
        </div>
      </div>
    </div>
    {/* Shipping options */}
    <div style={{ background:'white', borderRadius:16, padding:20, boxShadow:'0 1px 4px rgba(29,34,53,0.06)', marginBottom:20 }}>
      <div style={{ fontSize:14, fontWeight:600, color:'#1D2235', marginBottom:14 }}>Forma de entrega</div>
      {[['Padrão','5–7 dias úteis','Grátis'],['Expresso','2–3 dias úteis','R$ 19,90'],['Retirada','Combinar','Grátis']].map(([label,days,price],i) => (
        <label key={i} style={{ display:'flex', alignItems:'center', gap:12, padding:'12px 0', borderBottom: i<2 ? '1px solid #EEF1F8' : 'none', cursor:'pointer' }}>
          <input type="radio" name="shipping" defaultChecked={i===0} style={{ width:'auto', accentColor:'#1D2235' }} />
          <div style={{ flex:1 }}>
            <div style={{ fontSize:14, fontWeight:500, color:'#1D2235' }}>{label}</div>
            <div style={{ fontSize:12, color:'#6B7494' }}>{days}</div>
          </div>
          <div style={{ fontFamily:"'DM Mono',monospace", fontSize:13, fontWeight:500, color: price==='Grátis' ? '#2E7D6E' : '#1D2235' }}>{price}</div>
        </label>
      ))}
    </div>
    <div style={{ display:'flex', gap:12 }}>
      <button onClick={onBack} style={{ flex:'0 0 auto', background:'white', color:'#1D2235', fontFamily:"'DM Sans',sans-serif", fontSize:15, fontWeight:600, padding:'15px 24px', border:'1.5px solid #D8DCE8', borderRadius:12, cursor:'pointer' }}>← Voltar</button>
      <button onClick={onNext} style={{ flex:1, background:'#1D2235', color:'white', fontFamily:"'DM Sans',sans-serif", fontSize:16, fontWeight:600, padding:'15px 0', border:'none', borderRadius:12, cursor:'pointer' }}>Continuar para pagamento</button>
    </div>
  </div>
);

const StepPayment = ({ onNext, onBack }) => {
  const [method, setMethod] = React.useState('card');
  return (
    <div>
      <h2 style={{ fontFamily:"'Playfair Display',serif", fontSize:28, fontWeight:700, color:'#1D2235', marginBottom:24 }}>Pagamento</h2>
      <div style={{ background:'white', borderRadius:16, padding:24, boxShadow:'0 1px 4px rgba(29,34,53,0.06)', marginBottom:20 }}>
        <div style={{ display:'flex', gap:10, marginBottom:24 }}>
          {[['card','💳 Cartão'],['pix','⚡ Pix'],['boleto','📄 Boleto']].map(([key,label]) => (
            <button key={key} onClick={() => setMethod(key)} style={{ flex:1, fontFamily:"'DM Sans',sans-serif", fontSize:14, fontWeight:600, padding:'11px 0', borderRadius:10, border: method===key ? '1.5px solid #1D2235' : '1.5px solid #D8DCE8', background: method===key ? '#1D2235' : 'white', color: method===key ? 'white' : '#3D4460', cursor:'pointer', transition:'all 150ms' }}>{label}</button>
          ))}
        </div>
        {method==='card' && (
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
            <div style={{ gridColumn:'span 2' }}><label>Número do cartão</label><input placeholder="0000 0000 0000 0000" /></div>
            <div style={{ gridColumn:'span 2' }}><label>Nome no cartão</label><input placeholder="ANA P SILVA" /></div>
            <div><label>Validade</label><input placeholder="MM/AA" /></div>
            <div><label>CVV</label><input placeholder="123" /></div>
            <div style={{ gridColumn:'span 2' }}>
              <label>Parcelas</label>
              <select style={{ width:'100%', fontFamily:"'DM Sans',sans-serif", fontSize:14, padding:'11px 14px', border:'1.5px solid #D8DCE8', borderRadius:10, outline:'none', background:'white' }}>
                {['1x de R$ 179,80 sem juros','2x de R$ 89,90 sem juros','3x de R$ 59,93 sem juros','6x de R$ 29,97 sem juros','12x de R$ 14,98 sem juros'].map(o => <option key={o}>{o}</option>)}
              </select>
            </div>
          </div>
        )}
        {method==='pix' && (
          <div style={{ textAlign:'center', padding:'24px 0' }}>
            <div style={{ width:160, height:160, background:'#EEF1F8', borderRadius:12, margin:'0 auto 16px', display:'flex', alignItems:'center', justifyContent:'center' }}>
              <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#A8AFCA" strokeWidth="1"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            </div>
            <div style={{ fontSize:14, fontWeight:600, color:'#1D2235', marginBottom:4 }}>QR Code gerado após confirmação</div>
            <div style={{ fontSize:13, color:'#6B7494' }}>Pague com qualquer app de banco · Confirmação em segundos</div>
          </div>
        )}
        {method==='boleto' && (
          <div style={{ textAlign:'center', padding:'24px 0' }}>
            <div style={{ fontSize:40, marginBottom:12 }}>📄</div>
            <div style={{ fontSize:14, fontWeight:600, color:'#1D2235', marginBottom:4 }}>Boleto vence em 3 dias úteis</div>
            <div style={{ fontSize:13, color:'#6B7494' }}>O pedido só é confirmado após o pagamento</div>
          </div>
        )}
      </div>
      <div style={{ display:'flex', gap:12 }}>
        <button onClick={onBack} style={{ flex:'0 0 auto', background:'white', color:'#1D2235', fontFamily:"'DM Sans',sans-serif", fontSize:15, fontWeight:600, padding:'15px 24px', border:'1.5px solid #D8DCE8', borderRadius:12, cursor:'pointer' }}>← Voltar</button>
        <button onClick={onNext} style={{ flex:1, background:'#1D2235', color:'white', fontFamily:"'DM Sans',sans-serif", fontSize:16, fontWeight:600, padding:'15px 0', border:'none', borderRadius:12, cursor:'pointer' }}>🔒 Finalizar pedido</button>
      </div>
    </div>
  );
};

const StepConfirmation = () => (
  <div style={{ textAlign:'center', padding:'40px 0' }}>
    <div style={{ width:80, height:80, background:'#E0F4F0', borderRadius:'50%', margin:'0 auto 24px', display:'flex', alignItems:'center', justifyContent:'center', fontSize:36 }}>✓</div>
    <h2 style={{ fontFamily:"'Playfair Display',serif", fontSize:36, fontWeight:700, color:'#1D2235', marginBottom:12 }}>Pedido confirmado!</h2>
    <p style={{ fontSize:16, color:'#6B7494', marginBottom:8 }}>Pedido <strong style={{ fontFamily:"'DM Mono',monospace", color:'#1D2235' }}>#BD-004382</strong> recebido com sucesso.</p>
    <p style={{ fontSize:15, color:'#6B7494', marginBottom:32 }}>Você receberá um e-mail com todos os detalhes e rastreamento.</p>
    <div style={{ background:'white', borderRadius:16, padding:24, maxWidth:400, margin:'0 auto 32px', textAlign:'left', boxShadow:'0 1px 4px rgba(29,34,53,0.06)' }}>
      {[['Prazo estimado','5–7 dias úteis'],['Frete','Grátis'],['Total','R$ 179,80']].map(([k,v]) => (
        <div key={k} style={{ display:'flex', justifyContent:'space-between', padding:'10px 0', borderBottom:'1px solid #EEF1F8' }}>
          <span style={{ fontSize:14, color:'#6B7494' }}>{k}</span>
          <span style={{ fontSize:14, fontWeight:600, color:'#1D2235', fontFamily: k==='Total' ? "'DM Mono',monospace" : 'inherit' }}>{v}</span>
        </div>
      ))}
    </div>
    <div style={{ display:'flex', gap:12, justifyContent:'center' }}>
      <a href="index.html" style={{ background:'#1D2235', color:'white', fontFamily:"'DM Sans',sans-serif", fontSize:15, fontWeight:600, padding:'13px 28px', border:'none', borderRadius:12, cursor:'pointer', textDecoration:'none' }}>Continuar comprando</a>
      <button style={{ background:'white', color:'#1D2235', fontFamily:"'DM Sans',sans-serif", fontSize:15, fontWeight:600, padding:'13px 28px', border:'1.5px solid #D8DCE8', borderRadius:12, cursor:'pointer' }}>Rastrear pedido</button>
    </div>
  </div>
);

const CheckoutApp = () => {
  const [step, setStep] = React.useState(0);
  const next = () => setStep(s => Math.min(3, s+1));
  const back = () => setStep(s => Math.max(0, s-1));

  return (
    <>
      <header style={{ background:'white', borderBottom:'1px solid #D8DCE8', padding:'0 48px', height:68, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <a href="index.html" style={{ display:'flex', alignItems:'center', gap:10, textDecoration:'none' }}>
          <img src="../../assets/logo.png" alt="B&D" style={{ height:42, width:42, objectFit:'contain' }} />
          <div style={{ fontFamily:"'Playfair Display',serif", fontWeight:700, fontSize:17, color:'#1D2235' }}>B&amp;D</div>
        </a>
        <div style={{ fontSize:13, color:'#6B7494' }}>🔒 Compra segura</div>
      </header>
      <div style={{ maxWidth:1100, margin:'48px auto', padding:'0 32px', display:'grid', gridTemplateColumns:'1fr 380px', gap:40, alignItems:'start' }}>
        <div>
          <StepBar step={step} />
          {step===0 && <StepCart onNext={next} />}
          {step===1 && <StepShipping onNext={next} onBack={back} />}
          {step===2 && <StepPayment onNext={next} onBack={back} />}
          {step===3 && <StepConfirmation />}
        </div>
        {step < 3 && <OrderSummary />}
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<CheckoutApp />);
</script>
</body>
</html>
